# Builds the RISE+ desktop app for Windows and Linux and attaches the files to a GitHub release.
# Trigger: push a tag like v1.0.1 (see README.md). Free on public repositories.
name: Build desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder
      - name: Report a failed build as an issue (so the log can be read without signing in)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; echo '```'; tail -c 12000 build.log; echo '```'; } > issue.md
          gh issue create --title "Build failed on ${{ matrix.os }} (run ${{ github.run_id }})" --body-file issue.md
      - name: Attach files to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RISE-Plus-Setup.exe
            dist/RISE-Plus-Portable.exe
            dist/RISE-Plus.AppImage
            dist/rise-plus.deb
          fail_on_unmatched_files: false
          generate_release_notes: true
