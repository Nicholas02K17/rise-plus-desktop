# Builds the RISE+ desktop app for Windows and Linux and attaches the files to a GitHub release.
# Trigger: push a tag like v1.0.1 (see README.md). Free on public repositories.
name: Build desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach files to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RISE-Plus-Setup.exe
            dist/RISE-Plus-Portable.exe
            dist/RISE-Plus.AppImage
            dist/rise-plus.deb
          fail_on_unmatched_files: false
          generate_release_notes: true
