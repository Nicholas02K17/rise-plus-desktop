<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RISE+</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #faf7f2; color: #1f1a17; }
    @media (prefers-color-scheme: dark) { body { background: #181412; color: #f3ede7; } .card { background: #241e1b; border-color: #3a312c; } }
    .card { max-width: 420px; margin: 24px; padding: 28px; border: 1px solid #e6ddd3; border-radius: 16px; background: #fff; text-align: center; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { margin: 0 0 16px; }
    .muted { opacity: .75; font-size: .9rem; }
    button { font: inherit; font-weight: 600; padding: 12px 22px; border: 0; border-radius: 10px; background: #ac2028; color: #fff; cursor: pointer; }
    button:hover { background: #8e1a21; }
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>RISE+ cannot be reached right now</h1>
    <p>Check your internet connection. If the connection is fine, the RISE+ server may be waking up, which can take up to a minute.</p>
    <p><button type="button" id="retry">Try again</button></p>
    <p class="muted" id="reason"></p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const site = params.get('site') || 'https://rise-plus.onrender.com';
    const reason = params.get('reason');
    if (reason) document.getElementById('reason').textContent = 'Details: ' + reason;
    document.getElementById('retry').addEventListener('click', () => { location.href = site; });
    setTimeout(() => { location.href = site; }, 20000);
  </script>
</body>
</html>
